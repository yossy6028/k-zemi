<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Kゼミ ブログ管理画面 パスワード設定</title>
  <link rel="icon" href="/images/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', -apple-system, sans-serif;
      background: linear-gradient(135deg, #E8F5E9 0%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.7;
      color: #2D3748;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.08);
      max-width: 560px;
      width: 100%;
      padding: 40px 32px;
    }
    h1 {
      font-size: 1.6rem;
      color: #0D3311;
      font-weight: 900;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      color: #718096;
      font-size: 0.95rem;
      margin-bottom: 28px;
      text-align: center;
    }
    .email-row {
      background: #F7FAFC;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #4A5568;
      word-break: break-all;
    }
    .email-row strong { color: #0D3311; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.92rem; }
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #E2E8F0;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
      transition: border-color .2s;
    }
    input[type="password"]:focus { border-color: #1B5E20; }
    .hint { font-size: 0.82rem; color: #718096; margin-top: -10px; margin-bottom: 16px; }
    .btn-primary {
      width: 100%;
      background: #1B5E20;
      color: #fff;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-primary:hover { background: #0D3311; }
    .btn-primary:disabled { background: #A0AEC0; cursor: not-allowed; }
    .alert {
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
    .alert-error { background: #FED7D7; color: #9B2C2C; border: 1px solid #FC8181; }
    .alert-success { background: #C6F6D5; color: #22543D; border: 1px solid #68D391; }
    .no-token {
      text-align: center;
      color: #718096;
    }
    .no-token a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: #1B5E20;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>パスワード設定</h1>
    <p class="subtitle">Kゼミ ブログ管理画面の初回ログイン</p>

    <div id="noTokenView" class="no-token" style="display:none">
      <p>招待トークンが見つかりません。</p>
      <p>招待メールのリンクから直接アクセスしてください。</p>
      <a href="/admin/">管理画面（ログイン済みの方）</a>
    </div>

    <div id="formView" style="display:none">
      <div class="email-row">
        登録メールアドレス: <strong id="emailDisplay">読み込み中...</strong>
      </div>
      <div id="alertBox"></div>
      <form id="signupForm">
        <label for="pw">新しいパスワード（8文字以上）</label>
        <input type="password" id="pw" minlength="8" required autocomplete="new-password" placeholder="例: kzemi2026spring">
        <p class="hint">英字・数字・記号を組み合わせると安全です。設定したパスワードは必ず覚えてください。</p>
        <button type="submit" class="btn-primary" id="submitBtn">パスワードを設定して管理画面に進む</button>
      </form>
    </div>
  </main>

  <script>
    const IDENTITY_BASE = 'https://effervescent-selkie-38a0aa.netlify.app/.netlify/identity';

    // hash から invite_token を抽出
    const hash = location.hash || '';
    const tokenMatch = hash.match(/invite_token=([^&]+)/);
    const recoveryMatch = hash.match(/recovery_token=([^&]+)/);
    const confirmMatch = hash.match(/confirmation_token=([^&]+)/);
    const token = tokenMatch ? tokenMatch[1] : (recoveryMatch ? recoveryMatch[1] : (confirmMatch ? confirmMatch[1] : null));
    const tokenType = tokenMatch ? 'signup' : (recoveryMatch ? 'recovery' : (confirmMatch ? 'signup' : null));

    if (!token) {
      document.getElementById('noTokenView').style.display = 'block';
    } else {
      document.getElementById('formView').style.display = 'block';
      // メールアドレスを表示するため、トークンをJWTとしてデコード（payload部分のみ）
      try {
        // invite_token は GoTrue 内部形式で email を含まないので、最初は不明
        document.getElementById('emailDisplay').textContent = '招待メールに記載のメールアドレス';
      } catch (e) {}
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('pw').value;
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      btn.disabled = true;
      btn.textContent = '設定中...';
      alertBox.innerHTML = '';

      try {
        // /verify エンドポイントで invite accept + パスワード設定
        const res = await fetch(IDENTITY_BASE + '/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: tokenType, token: token, password: password })
        });
        const data = await res.json();

        if (!res.ok) {
          alertBox.innerHTML = '<div class="alert alert-error">エラー: ' + (data.msg || data.error_description || JSON.stringify(data)) + '</div>';
          btn.disabled = false;
          btn.textContent = 'パスワードを設定して管理画面に進む';
          return;
        }

        // 成功: gotrue-js 互換形式で localStorage に保存
        const expiresAt = Math.floor(Date.now() / 1000) + (data.expires_in || 3600);
        // ユーザー情報も取得
        const userRes = await fetch(IDENTITY_BASE + '/user', {
          headers: { 'Authorization': 'Bearer ' + data.access_token }
        });
        const user = userRes.ok ? await userRes.json() : { email: '', id: '' };

        const sessionData = {
          url: IDENTITY_BASE,
          token: {
            access_token: data.access_token,
            refresh_token: data.refresh_token,
            expires_at: expiresAt * 1000,
            token_type: data.token_type
          },
          id: user.id,
          aud: user.aud || '',
          role: user.role || '',
          email: user.email || '',
          confirmed_at: user.confirmed_at || new Date().toISOString(),
          app_metadata: user.app_metadata || {},
          user_metadata: user.user_metadata || {},
          created_at: user.created_at || new Date().toISOString(),
          updated_at: user.updated_at || new Date().toISOString()
        };

        // gotrue-js は `gotrue.user.<APIUrl>` キーで保存
        localStorage.setItem('gotrue.user.' + IDENTITY_BASE, JSON.stringify(sessionData));
        // Decap CMS は別のキーで参照する場合もあるため複数キーに保存
        localStorage.setItem('netlifySiteURL', 'https://effervescent-selkie-38a0aa.netlify.app/');

        alertBox.innerHTML = '<div class="alert alert-success">✅ パスワード設定成功！管理画面に移動します...</div>';
        document.getElementById('emailDisplay').textContent = user.email || '';
        setTimeout(() => { location.href = '/admin/'; }, 1800);
      } catch (err) {
        alertBox.innerHTML = '<div class="alert alert-error">通信エラー: ' + err.message + '</div>';
        btn.disabled = false;
        btn.textContent = 'パスワードを設定して管理画面に進む';
      }
    });
  </script>
</body>
</html>
