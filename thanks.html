<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>お問い合わせありがとうございました｜個別指導塾 Kゼミ 中野校</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#1B5E20;--primary-dark:#0d3311;--accent:#C9A227;--accent-hover:#a8861f;--text:#1a1a1a;--text-light:#5a6c7d;--bg:#fafdfb;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',sans-serif;color:var(--text);background:linear-gradient(180deg,#f6fbf7 0%,#e8f5e9 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 1.5rem;line-height:1.7}
.card{max-width:640px;width:100%;background:#fff;border-radius:20px;padding:56px 40px;box-shadow:0 12px 48px rgba(13,51,17,.12);text-align:center;border:1px solid rgba(27,94,32,.08)}
.icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;margin:0 auto 28px;box-shadow:0 8px 24px rgba(27,94,32,.28)}
.icon svg{width:44px;height:44px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:'Noto Serif JP',serif;font-size:1.9rem;font-weight:700;color:var(--primary-dark);margin-bottom:20px;letter-spacing:.02em}
.lead{font-size:1.05rem;color:var(--text);margin-bottom:24px;font-weight:500}
.detail{font-size:.95rem;color:var(--text-light);background:#f6fbf7;border-radius:12px;padding:20px 24px;margin-bottom:32px;text-align:left;border-left:4px solid var(--primary)}
.detail strong{color:var(--primary-dark);font-weight:700}
.detail p+p{margin-top:10px}
.contact-info{font-size:.92rem;color:var(--text-light);margin-bottom:32px}
.contact-info a{color:var(--primary);font-weight:700;text-decoration:none}
.contact-info a:hover{text-decoration:underline}
.btn{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:#fff;padding:16px 40px;border-radius:60px;font-weight:700;font-size:1rem;text-decoration:none;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 16px rgba(201,162,39,.42)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(201,162,39,.5)}
@media(max-width:600px){.card{padding:40px 24px}h1{font-size:1.5rem}}
</style>
</head>
<body>
<main class="card">
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
  </div>
  <h1>お問い合わせを受け付けました</h1>
  <p class="lead">この度はKゼミ中野校にご関心をお寄せいただき、誠にありがとうございます。</p>
  <div class="detail">
    <p><strong>📩 送信完了</strong><br>ご入力内容を受信いたしました。</p>
    <p><strong>📞 ご連絡について</strong><br>担当より3営業日以内にメールまたはお電話でご連絡を差し上げます。</p>
    <p><strong>⚠️ 万が一返信が届かない場合</strong><br>迷惑メールフォルダをご確認のうえ、お手数ですが直接お電話ください。</p>
  </div>
  <p class="contact-info">
    お急ぎの場合：<a href="tel:0333825707">03-3382-5707</a>
  </p>
  <a href="/" class="btn">トップページに戻る</a>
</main>
</body>
</html>
