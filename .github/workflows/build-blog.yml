name: Build Kzemi Blog

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'images/**'
      - 'build_blog.py'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch:

concurrency:
  group: build-blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build blog
        run: |
          python3 build_blog.py
          echo "=== generated ==="
          ls -la dist/blog/ || true

      - name: Sync dist/blog -> blog
        run: |
          rm -rf blog
          cp -R dist/blog blog
          rm -rf dist

      - name: Commit & push (with rebase + retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain blog)" ]]; then
            echo "変更なし。スキップ。"
            exit 0
          fi
          git add blog
          git commit -m "Kゼミ ブログ自動ビルド ($(date '+%Y-%m-%d %H:%M JST'))"
          # 競合耐性: pull --rebase + push を最大5回リトライ
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "✅ Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ Push attempt $attempt failed, fetching latest and rebasing..."
            git fetch origin main
            git rebase origin/main || {
              echo "❌ Rebase failed; resetting and retrying"
              git rebase --abort || true
              git pull --rebase origin main || exit 1
            }
            sleep $((attempt * 2))
          done
          echo "❌ Push failed after 5 attempts"
          exit 1
