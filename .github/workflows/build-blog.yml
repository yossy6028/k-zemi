name: Build Kzemi Blog

# ====================================================================
# 公開アーキテクチャ:
#   main         = ソースブランチ (posts/, build_blog.py, 管理画面HTML, images/)
#                  - 塾長は Git Gateway 経由で main の posts/ にのみ commit する
#   gh-pages    = 公開ブランチ (force push で毎回上書き、履歴は1コミットのみ)
#                  - GitHub Pages の Source は gh-pages / (root)
#                  - 管理画面ファイル + 生成済み blog/ + images/ + CNAME + .nojekyll
#
# 利点:
#   - main の先端は posts/ への塾長 commit でしか動かない
#   - 並行 Actions ビルドが main を進める事象が消える
#   - Git Gateway の base commit レース ("is at X but expected Y") が構造的に発生しない
#   - gh-pages は force push なので conflict も発生しない
# ====================================================================

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'images/**'
      - 'build_blog.py'
      - 'post.html'
      - 'manage.html'
      - 'login.html'
      - 'signup.html'
      - 'index.html'
      - 'blog-cms.html'
      - 'thanks.html'
      - 'robots.txt'
      - 'llms.txt'
      - 'favicon.ico'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch:

concurrency:
  group: build-blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build blog from posts/
        run: |
          python3 build_blog.py
          echo "=== generated dist/blog ==="
          ls -la dist/blog/ || true

      - name: Stage gh-pages content
        run: |
          set -e
          STAGING=_gh_pages_staging
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          # 管理画面 HTML 一式（main の root 直置きのもの）
          for f in post.html manage.html login.html signup.html index.html blog-cms.html thanks.html; do
            if [ -f "$f" ]; then
              cp "$f" "$STAGING/"
            fi
          done

          # dist/index.html (build_blog.py が最新3件で書き換えた本体HP) があれば上書き
          if [ -f dist/index.html ]; then
            cp dist/index.html "$STAGING/index.html"
            echo "✓ dist/index.html (最新3件反映版) を採用"
          fi

          # 公開資産
          cp -R dist/blog "$STAGING/blog"
          if [ -d images ]; then
            cp -R images "$STAGING/images"
          fi

          # 公開メタ（カスタムドメイン + Jekyll 無効化）
          if [ -f CNAME ]; then cp CNAME "$STAGING/CNAME"; fi
          touch "$STAGING/.nojekyll"

          # SEO 資産: robots.txt (静的)
          if [ -f robots.txt ]; then
            cp robots.txt "$STAGING/robots.txt"
            echo "✓ robots.txt をコピー"
          fi

          # AIEO 資産: llms.txt (生成AI向けのサイト要約。静的)
          if [ -f llms.txt ]; then
            cp llms.txt "$STAGING/llms.txt"
            echo "✓ llms.txt をコピー"
          fi

          # サイトアイコン: favicon.ico (ルート直置き、/favicon.ico 経路 / SERP 用)
          if [ -f favicon.ico ]; then
            cp favicon.ico "$STAGING/favicon.ico"
            echo "✓ favicon.ico をコピー"
          fi

          # SEO 資産: sitemap.xml (build_blog.py が posts/ から動的生成)
          if [ -f dist/sitemap.xml ]; then
            cp dist/sitemap.xml "$STAGING/sitemap.xml"
            echo "✓ dist/sitemap.xml をコピー"
          fi

          echo "=== staging contents ==="
          ls -la "$STAGING/"

      - name: Deploy to gh-pages (force push, orphan history)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STAGING=_gh_pages_staging

          # 一時 worktree で gh-pages を構築
          rm -rf /tmp/gh_pages_worktree
          git worktree add --detach /tmp/gh_pages_worktree
          cd /tmp/gh_pages_worktree

          # 既存ファイルを全削除（.git は worktree なので残る）
          git rm -rf . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # ステージングからコピー
          cp -R "$GITHUB_WORKSPACE/$STAGING/." ./

          git add -A
          # 変更があるかチェック
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "✅ 変更なし。デプロイスキップ。"
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force /tmp/gh_pages_worktree
            exit 0
          fi

          # orphan commit を作る（履歴を1コミットだけにする）
          # 親なし commit を作って gh-pages に force push
          TREE_SHA=$(git write-tree)
          COMMIT_MSG="Kゼミ ブログ公開ビルド ($(date '+%Y-%m-%d %H:%M JST'))"
          COMMIT_SHA=$(git commit-tree "$TREE_SHA" -m "$COMMIT_MSG")
          git update-ref refs/heads/gh-pages "$COMMIT_SHA"

          # force push (gh-pages は公開対象、履歴保持不要)
          git push --force origin gh-pages

          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/gh_pages_worktree

          echo "✅ gh-pages に公開ビルドを force push しました"
