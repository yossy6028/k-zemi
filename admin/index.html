<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=/post.html">
  <title>Kゼミ ブログ管理画面</title>
  <script>
    // ログイン済みなら /post.html へ、未ログインなら /login.html へ
    try {
      const user = JSON.parse(localStorage.getItem('gotrue.user') || 'null');
      location.replace(user ? '/post.html' : '/login.html');
    } catch (e) {
      location.replace('/login.html');
    }
  </script>
</head>
<body>
  <p style="font-family:sans-serif;padding:40px;text-align:center;color:#666">
    管理画面は移動しました。自動的にリダイレクトします...<br>
    <a href="/post.html">記事投稿画面へ</a> / <a href="/login.html">ログイン画面へ</a>
  </p>
</body>
</html>
